name: Build TempShell X APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          test -f "TempShellX-Android7-16-source (2).zip"
          unzip -q "TempShellX-Android7-16-source (2).zip" -d extracted
          test -f extracted/TempShellX/settings.gradle.kts

      - name: Fix JVM target and iQOO SU path
        run: |
          cat << 'EOF' >> extracted/TempShellX/app/build.gradle.kts

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          sed -i 's/\$d/\\\$d/g; s/\$p/\\\$p/g' extracted/TempShellX/app/src/main/java/com/tempshellx/MainActivity.kt
          sed -i 's|ProcessBuilder("su", "-c", command)|ProcessBuilder("/apex/com.android.virt/bin/su", "-c", command)|g' extracted/TempShellX/app/src/main/java/com/tempshellx/MainActivity.kt

      - name: Build debug APK
        working-directory: extracted/TempShellX
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TempShellX-debug-apk
          path: extracted/TempShellX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
