name: Build TempShell X APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          test -f TempShellX-source.zip
          unzip -q TempShellX-source.zip -d extracted
          test -f extracted/TempShellX/settings.gradle.kts

      - name: Build debug APK
        working-directory: extracted/TempShellX
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TempShellX-debug-apk
          path: extracted/TempShellX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
